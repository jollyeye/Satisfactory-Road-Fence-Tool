; Road Maker localization: gathers the texts (C++ NSLOCTEXT and the assets), imports the translations from
; Content/Localization/RoadMaker/<culture>/RoadMaker.po and compiles them into .locres for packaging.
; Run by Tools/update-and-package.bat:  UnrealEditor-Cmd.exe <project> -run=GatherText -config=<this file>
; Paths are relative to the project folder (D:\SFMods\SML).

[CommonSettings]
SourcePath=Mods/RoadMaker/Content/Localization/RoadMaker
DestinationPath=Mods/RoadMaker/Content/Localization/RoadMaker
ManifestName=RoadMaker.manifest
ArchiveName=RoadMaker.archive
PortableObjectName=RoadMaker.po
ResourceName=RoadMaker.locres
bSkipSourceCheck=true
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Mods/RoadMaker/Source
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Mods/RoadMaker/Content/*
ExcludePathFilters=Mods/RoadMaker/Content/Localization/*
PackageFileExtensions=*.umap
PackageFileExtensions=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
POFormat=EPortableObjectFormat::Unreal

[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
POFormat=EPortableObjectFormat::Unreal

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationResource
